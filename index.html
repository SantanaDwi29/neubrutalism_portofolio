<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of I Made Santana Dwiananda, a Full-Stack Developer specializing in modern web development with React and Laravel." />
  <title>PORTFOLIO | I MADE SANTANA DWIANANDA</title>

  <link rel="preload" href="/fonts/plus-jakarta-sans.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/hero/hero-optimized.webp" as="image" type="image/webp" fetchpriority="high" />
  <script>
    try {
      const theme = localStorage.getItem('portfolio-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* Use the system theme when storage is unavailable. */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
